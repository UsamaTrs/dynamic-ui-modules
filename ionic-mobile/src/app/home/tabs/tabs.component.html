<ion-router-outlet></ion-router-outlet>
<ion-tabs>

  <ion-tab-bar
  slot="bottom"
  >
    <ion-tab-button  href="/tabs">
      <div class="tab-item">
        <i [class]="'fa fa-' + 'home' + ' fa-2xl'"></i>
        <ion-label style="font-size: small; font-weight: 600"
          >Home</ion-label
        >
      </div>
    </ion-tab-button>
    @for (tab of tabs.slice(0,4); track tab._id) {

    <ion-tab-button   href="/tabs/tab/{{tab._id}}">
      <div class="tab-item">
        <i [class]="'fa fa-2xl ' + tab.icon"></i>
        <ion-label>{{ tab.title }}</ion-label>
      </div>
    </ion-tab-button>

  }
</ion-tab-bar>
</ion-tabs>
