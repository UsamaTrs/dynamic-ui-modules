<ion-tabs>
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom" style="--border-radius: 50%; --ion-tab-bar-background: #d7ccc8; --ion-tab-bar-border-color: transparent; height: 80px">
    <ion-tab-button tab="home" routerLink="/tabs/home">
      <ion-icon name="home"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
     @for (tab of tabs; track tab._id){
      <ion-tab-button tab="tab._id" routerLink="/tab/2"  style="--padding-top: 0; --padding-bottom: 0">
        <div class="tab-content"
             [style.background-color]="tab.bgColor"
             [style.background-image]="'url(' + tab.avatar + ')'"
             style="width: 50px; height: 50px; background-size: contain; background-position: center; background-repeat: no-repeat;border-radius: 50%;">
        </div>
        <ion-label [style.color]="tab.fontColor" style="font-size: 12px; margin-top: 5px">{{ tab.title }}</ion-label>
      </ion-tab-button>
     }
  </ion-tab-bar>
</ion-tabs>
